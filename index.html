<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAI Bio Studio</title>
<style>
  :root{
    --bg:#0e1013; --panel:#15181d; --panel2:#1b1f26; --line:#262c35;
    --text:#d8dde5; --dim:#7d8896; --accent:#8ab870; --accent2:#7088b8;
    --err:#e0625e; --warn:#d9a441;
    --c-tag:#8ab870; --c-attr:#d9a441; --c-str:#c98fd8; --c-cmt:#5a6472; --c-txt:#c7d0dc;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:13px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    display:flex; align-items:center; gap:10px; padding:0 12px; height:46px;
    border-bottom:1px solid var(--line); background:var(--panel); flex:none;
  }
  header .title{font-weight:600; letter-spacing:.02em; white-space:nowrap}
  header .title span{color:var(--accent)}
  header .sub{color:var(--dim); font-size:11.5px; white-space:nowrap}
  .spacer{flex:1}
  button{
    font:inherit; color:var(--text); background:var(--panel2); border:1px solid var(--line);
    border-radius:5px; padding:5px 10px; cursor:pointer; white-space:nowrap;
  }
  button:hover{background:#222833; border-color:#333b47}
  button:active{transform:translateY(1px)}
  button.ghost{background:transparent}
  button.primary{background:#2c4a2a; border-color:#3d6340; color:#cfe8c5}
  button.primary:hover{background:#345a31}
  button.danger:hover{background:#3a2224; border-color:#5a2f31; color:#f0a8a5}
  button.sm{padding:3px 8px; font-size:11.5px}
  input,select,textarea{
    font:inherit; color:var(--text); background:var(--panel2);
    border:1px solid var(--line); border-radius:5px; padding:5px 8px; outline:none;
  }
  input:focus,select:focus,textarea:focus{border-color:#3c4756}
  select{cursor:pointer}
  .label{color:var(--dim); font-size:11.5px; text-transform:uppercase; letter-spacing:.09em; white-space:nowrap}
  main{flex:1; display:flex; min-height:0}
  #pane-left,#pane-right{display:flex; flex-direction:column; min-width:0; flex-basis:50%}
  #divider{flex:none; width:6px; cursor:col-resize; background:var(--panel); border-left:1px solid var(--line); border-right:1px solid var(--line)}
  #divider:hover{background:#232a34}
  .toolbar{
    display:flex; align-items:center; gap:8px; padding:7px 10px; flex:none;
    border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap;
  }
  .seg{display:flex; border:1px solid var(--line); border-radius:5px; overflow:hidden}
  .seg button{border:0; border-radius:0; background:transparent; color:var(--dim); padding:5px 10px}
  .seg button.on{background:#2a323d; color:var(--text)}

  /* редактор с подсветкой */
  #editwrap{position:relative; flex:1; min-height:0; background:#0b0d10}
  #hl,#code{
    position:absolute; inset:0; margin:0; padding:12px 14px;
    font:12.5px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    tab-size:2; white-space:pre; overflow:auto; border:0; border-radius:0;
  }
  #hl{pointer-events:none; color:var(--c-txt); background:transparent; overflow:hidden}
  #code{background:transparent; color:transparent; caret-color:#ffd479; resize:none; outline:none}
  #code::selection{background:rgba(112,136,184,.35)}
  .t-tag{color:var(--c-tag)}
  .t-attr{color:var(--c-attr)}
  .t-str{color:var(--c-str)}
  .t-cmt{color:var(--c-cmt); font-style:italic}
  .t-punct{color:#6b7787}

  #preview{flex:1; width:100%; border:0; background:#141414}
  .snippets{display:flex; gap:6px; flex-wrap:wrap}
  .snippets button{font-size:11.5px; padding:4px 8px; color:var(--dim)}
  .snippets button:hover{color:var(--text)}

  #bottom{flex:none; height:214px; display:flex; flex-direction:column; border-top:1px solid var(--line); background:var(--panel)}
  #bottom.collapsed{height:37px}
  #bottom.collapsed .panes{display:none}
  .tabs{display:flex; align-items:center; gap:2px; flex:none; border-bottom:1px solid var(--line); padding-right:10px}
  .tabs button{border:0; border-radius:0; background:transparent; color:var(--dim); padding:8px 12px; border-bottom:2px solid transparent}
  .tabs button.on{color:var(--text); border-bottom-color:var(--accent)}
  .count{display:inline-block; margin-left:6px; font-size:10.5px; padding:0 5px; border-radius:8px; background:#2a323d; color:var(--dim)}
  .count.bad{background:#4a2a29; color:#f0a8a5}
  .panes{flex:1; min-height:0; overflow:auto; padding:10px 14px}
  .pane{display:none}
  .pane.on{display:block}

  .issue{display:flex; gap:10px; padding:3px 0; align-items:baseline; border-bottom:1px solid rgba(255,255,255,.04)}
  .issue .ln{flex:none; width:52px; text-align:right; color:var(--dim); font:11.5px/1.5 ui-monospace,monospace}
  .issue .lv{flex:none; width:56px; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em}
  .issue .lv.error{color:var(--err)}
  .issue .lv.warn{color:var(--warn)}
  .issue .lv.ok{color:var(--accent)}
  .issue .msg{flex:1}
  .okline{color:var(--accent)}

  .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:9px}
  #out{width:100%; height:96px; font:11.5px/1.55 ui-monospace,monospace; resize:none; white-space:pre}
  .hint{color:var(--dim); font-size:11.5px; margin:0}
  .stat{color:var(--dim); font-size:11.5px; font-variant-numeric:tabular-nums; white-space:nowrap}
  .stat b{color:var(--text); font-weight:600}

  /* галерея */
  .gal{display:flex; flex-direction:column; gap:4px}
  .gal-item{display:flex; align-items:center; gap:8px; padding:6px 8px; border:1px solid var(--line); border-radius:5px; background:var(--panel2)}
  .gal-item.cur{border-color:#3d6340; background:#1c241c}
  .gal-item .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .gal-item .meta{color:var(--dim); font-size:11px; white-space:nowrap}
  .empty{color:var(--dim); padding:6px 2px}

  /* панель картинки */
  #imgpanel{display:none; gap:8px; align-items:center; flex-wrap:wrap}
  #imgpanel.on{display:flex}
  #imgpanel input[type=number]{width:76px}
  .divider-v{width:1px; height:18px; background:var(--line)}

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:#2c4a2a; border:1px solid #3d6340; color:#cfe8c5;
    padding:8px 16px; border-radius:6px; font-size:12.5px; z-index:50;
    box-shadow:0 8px 24px rgba(0,0,0,.5); transition:opacity .25s;
  }
  .toast.err{background:#3a2224; border-color:#5a2f31; color:#f0a8a5}

  /* гайд */
  .help{max-width:860px; line-height:1.65; font-size:12.5px}
  .help h3{
    margin:0 0 8px; font-size:13px; font-weight:600; color:#fff;
    display:flex; align-items:center; gap:8px;
  }
  .help h3 .num{
    flex:none; width:20px; height:20px; border-radius:50%; background:#2c4a2a; color:#cfe8c5;
    font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .help .step{
    border:1px solid var(--line); border-radius:6px; background:var(--panel2);
    padding:10px 13px; margin:0 0 8px;
  }
  .help .step p{margin:0 0 6px}
  .help .step p:last-child{margin:0}
  .help code{
    background:#0b0d10; border:1px solid var(--line); border-radius:3px;
    padding:1px 5px; font:11.5px ui-monospace,monospace; color:var(--accent);
  }
  .help kbd{
    background:#2a323d; border:1px solid #3c4756; border-bottom-width:2px; border-radius:4px;
    padding:0 5px; font:11px ui-monospace,monospace;
  }
  .help .warn{
    border-left:3px solid var(--warn); background:rgba(217,164,65,.07);
  }
  .help .bad{
    border-left:3px solid var(--err); background:rgba(224,98,94,.07);
  }
  .help .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .help ul{margin:6px 0; padding-left:20px}
  .help li{margin:3px 0}
  .help .muted{color:var(--dim)}

  /* модалка */
  .modal{
    position:fixed; inset:0; background:rgba(6,8,10,.78); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; z-index:40; padding:20px;
  }
  .modal.on{display:flex}
  .modal-box{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    width:min(760px,100%); max-height:88vh; display:flex; flex-direction:column;
    box-shadow:0 24px 60px rgba(0,0,0,.6);
  }
  .modal-head{
    display:flex; align-items:center; gap:10px; padding:12px 16px;
    border-bottom:1px solid var(--line); flex:none;
  }
  .modal-title{font-weight:600; font-size:13.5px}
  .modal-body{padding:14px 16px; overflow:auto; flex:1; min-height:0}
  .modal-foot{
    display:flex; align-items:center; gap:10px; padding:10px 16px;
    border-top:1px solid var(--line); flex:none;
  }
</style>
</head>
<body>

<header>
  <div class="title">JAI <span>Bio</span> Studio</div>
  <div class="sub" data-i18n="sub"></div>
  <div class="spacer"></div>
  <span class="stat" id="stat"></span>
  <div class="seg" id="seg-lang">
    <button data-lang="ru" class="on">RU</button>
    <button data-lang="en">EN</button>
  </div>
  <button class="ghost sm" id="btn-help" title="F1">?</button>
  <button class="ghost sm" id="btn-new" data-i18n="newProfile"></button>
  <button class="ghost sm" id="btn-save" data-i18n="save"></button>
</header>

<main id="split">
  <section id="pane-left">
    <div class="toolbar">
      <span class="label" data-i18n="font"></span>
      <select id="fontsel"></select>
      <button class="sm" id="btn-apply-font" data-i18n="insert"></button>
      <div class="divider-v"></div>
      <button class="sm" id="btn-img" data-i18n="image"></button>
    </div>
    <div class="toolbar" id="imgpanel">
      <input id="img-url" placeholder="https://ella.janitorai.com/..." style="flex:1;min-width:180px" spellcheck="false">
      <span class="label" data-i18n="maxWidth"></span>
      <input id="img-w" type="number" value="320" min="40" max="1400" step="10">
      <span class="label" data-i18n="radius"></span>
      <input id="img-r" type="number" value="10" min="0" max="80" step="1">
      <div class="divider-v"></div>
      <button class="sm primary" id="btn-img-inline" data-i18n="insertInline"></button>
      <button class="sm" id="btn-img-bg" data-i18n="insertBg"></button>
      <button class="sm ghost" id="btn-img-close">✕</button>
    </div>
    <div class="toolbar">
      <span class="label" data-i18n="snippets"></span>
      <div class="snippets" id="snippets"></div>
    </div>
    <div id="editwrap">
      <pre id="hl" aria-hidden="true"></pre>
      <textarea id="code" spellcheck="false" autocomplete="off" wrap="off"></textarea>
    </div>
  </section>

  <div id="divider"></div>

  <section id="pane-right">
    <div class="toolbar">
      <span class="label" data-i18n="preview"></span>
      <div class="seg" id="seg-mode">
        <button data-mode="saved" class="on" data-i18n="modeSaved"></button>
        <button data-mode="raw" data-i18n="modeRaw"></button>
      </div>
      <button class="ghost sm" id="btn-bg"></button>
      <button class="ghost sm" id="btn-refresh" data-i18n="refresh"></button>
    </div>
    <iframe id="preview" title="preview"></iframe>
  </section>
</main>

<div id="bottom">
  <div class="tabs">
    <button data-tab="issues" class="on"><span data-i18n="tabIssues"></span><span class="count" id="cnt-issues">0</span></button>
    <button data-tab="report"><span data-i18n="tabSanitizer"></span><span class="count" id="cnt-report"></span></button>
    <button data-tab="export"><span data-i18n="tabExport"></span></button>
    <button data-tab="gallery"><span data-i18n="tabGallery"></span><span class="count" id="cnt-gal"></span></button>
    <button data-tab="help"><span data-i18n="tabHelp"></span></button>
    <div class="spacer"></div>
    <button class="ghost" id="btn-collapse" title="⌄">⌄</button>
  </div>
  <div class="panes">
    <div class="pane on" id="pane-issues"></div>

    <div class="pane" id="pane-report"></div>

    <div class="pane" id="pane-export">
      <div class="row">
        <span class="label" data-i18n="uuid"></span>
        <input id="uuid" placeholder="07446625-25bc-4a60-af8f-693385106fd2" style="width:330px" spellcheck="false">
        <span class="label" data-i18n="token"></span>
        <input id="token" placeholder="—" style="width:230px" spellcheck="false">
        <button class="sm" id="btn-get-token" data-i18n="getToken"></button>
        <label class="hint" style="display:flex;align-items:center;gap:6px">
          <input type="checkbox" id="minify" checked> <span data-i18n="minify"></span>
        </label>
      </div>
      <div class="row">
        <button class="primary" id="btn-copy-script" data-i18n="copyScript"></button>
        <button id="btn-copy-html" data-i18n="copyHtml"></button>
        <button id="btn-copy-verify" data-i18n="copyVerify"></button>
        <button id="btn-download" data-i18n="download"></button>
        <span class="hint" id="token-state"></span>
      </div>
      <textarea id="out" spellcheck="false"></textarea>
      <p class="hint" style="margin:6px 0 0" data-i18n="exportHint"></p>
    </div>

    <div class="pane" id="pane-gallery">
      <div class="row">
        <input id="gal-name" style="width:260px" spellcheck="false">
        <button class="primary sm" id="btn-gal-save" data-i18n="saveAs"></button>
        <div class="divider-v"></div>
        <button class="sm" id="btn-gal-import" data-i18n="importJson"></button>
        <button class="sm" id="btn-gal-export" data-i18n="exportJson"></button>
        <button class="sm ghost danger" id="btn-gal-clear" data-i18n="clearAll"></button>
        <input type="file" id="gal-file" accept="application/json" style="display:none">
      </div>
      <div class="gal" id="gal-list"></div>
    </div>

    <div class="pane" id="pane-help">
      <div class="help" id="help-body"></div>
    </div>
  </div>
</div>

<div id="welcome" class="modal">
  <div class="modal-box">
    <div class="modal-head">
      <span class="modal-title" data-i18n="welcomeTitle"></span>
      <button class="ghost sm" id="welcome-close">✕</button>
    </div>
    <div class="modal-body" id="welcome-body"></div>
    <div class="modal-foot">
      <label class="hint" style="display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="welcome-hide"> <span data-i18n="welcomeHide"></span>
      </label>
      <div class="spacer"></div>
      <button class="primary sm" id="welcome-ok" data-i18n="welcomeOk"></button>
    </div>
  </div>
</div>

        '<div class="step"><p>Встроенный редактор JanitorAI при сохранении вырезает <code>&lt;style&gt;</code>, <code>&lt;script&gt;</code>, <code>&lt;link&gt;</code> и все объявления <code>position</code>. А ещё удаляет строку <code>z-index</code> наивным поиском — даже если это просто слово в тексте. При этом сам сайт потом рисует био без всякой чистки, как есть. Значит, чтобы получить нормальный дизайн, нужно записать HTML в базу в обход редактора — напрямую через API.</p>',
        '<p>Этот файл делает две вещи: показывает, <b>что именно останется после серверной чистки</b> (правая панель), и собирает готовый скрипт для отправки.</p></div>',

        '<h3><span class="num">2</span> Шаг 1 — напиши HTML</h3>',

  // ------------------------------------------------------------- sanitize ----
  function sanitize(raw) {
    var counts = {

      script: (raw.match(/<script\b/gi) || []).length,
      link: (raw.match(/<link\b/gi) || []).length,

    var s = raw.replace(/z-index/g, "");
    var doc = new DOMParser().parseFromString(s, "text/html");

    ["style", "script", "link"].forEach(function (tag) {
      var nodes = doc.querySelectorAll(tag);
      for (var i = nodes.length - 1; i >= 0; i--) nodes[i].remove();
    });

    var posRemoved = 0, styleRewrites = 0;
    var styled = doc.querySelectorAll("[style]");
    for (var i = 0; i < styled.length; i++) {
      var el = styled[i], changed = false;
      if (el.style.position) { el.style.removeProperty("position"); posRemoved++; changed = true; }
      if (el.style.zIndex) { el.style.removeProperty("z-index"); posRemoved++; changed = true; }
      if (changed) {
        styleRewrites++;
        if (!el.getAttribute("style") || !el.getAttribute("style").trim()) el.removeAttribute("style");

    var report = [];
    if (counts.style) report.push({ lv: "error", msg: t("cutStyle", { n: counts.style }) });
    if (counts.script) report.push({ lv: "error", msg: t("cutScript", { n: counts.script }) });
    if (counts.link) report.push({ lv: "error", msg: t("cutLink", { n: counts.link }) });
    if (counts.zindex) report.push({ lv: "error", msg: t("cutZ", { n: counts.zindex }) });
    if (posRemoved) report.push({ lv: "error", msg: t("cutPos", { n: posRemoved, m: styleRewrites }) });
    if (!report.length) report.push({ lv: "ok", msg: t("cutNone") });
    report.push({ lv: "ok", msg: t("sizeLine", { a: fmtSize(bytes(raw)), b: fmtSize(bytes(html)) }) });

    L.push('  if (token) h["authorization"] = "Bearer " + token;');
    L.push("  const r = await fetch(`https://janitorai.com/hampter/characters/${UUID}`, { headers: h, credentials: \"include\" });");
    L.push("  if (!r.ok) throw new Error(r.status + \" \" + await r.text());");
    L.push("  const data = await r.json();");
    L.push('  console.log("%c--- SAVED BIO ---", "color:#8ab870;font-weight:bold");');
    L.push("  console.log(data.description || \"(empty)\");");
    L.push("})();");
    return L.join("\n");
  }

  // ---------------------------------------------------------------- toast ----
  var toastTimer = null;
  function toast(msg, isErr) {
    var el = document.querySelector(".toast");
    if (el) el.remove();
    el = document.createElement("div");
    el.className = "toast" + (isErr ? " err" : "");
    el.textContent = msg;
    document.body.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.style.opacity = "0"; setTimeout(function () { el.remove(); }, 260); }, 2200);
  }

  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { toast(t("copied")); },
        function () { fallbackCopy(text); toast(t("copied")); });
    } else { fallbackCopy(text); toast(t("copied")); }
  }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.left = "-9999px";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (_) {}
    ta.remove();
  }

  // ------------------------------------------------------------- storage -----
  function persist() {
    try {
      localStorage.setItem(STORE, JSON.stringify({
        lang: lang,
        profiles: state.profiles,
        currentId: state.currentId,
        uuid: $("uuid").value,
        minify: $("minify").checked,
        mode: state.mode,
        bg: state.bg,
        hideWelcome: state.hideWelcome
      }));
    } catch (_) {}
  }

  function restore() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (_) {}
    if (!s) {
      var old = null;
      try { old = JSON.parse(localStorage.getItem("jai-bio-studio") || "null"); } catch (_) {}
      code.value = (old && old.html) ? old.html : STARTER;
      state.profiles = [{ id: uid(), name: lang === "ru" ? "Черновик" : "Draft", html: code.value, updated: Date.now() }];
      state.currentId = state.profiles[0].id;
      return;
    }
    state.profiles = s.profiles || [];
    state.currentId = s.currentId || null;
    state.mode = s.mode || "saved";
    state.bg = s.bg || "dark";
    state.hideWelcome = !!s.hideWelcome;
    lang = s.lang || "ru";
    $("uuid").value = s.uuid || "";
    $("minify").checked = s.minify !== false;

    var cur = state.profiles.filter(function (p) { return p.id === state.currentId; })[0];
    code.value = cur ? cur.html : STARTER;
    if (!state.profiles.length) {
      state.profiles = [{ id: uid(), name: lang === "ru" ? "Черновик" : "Draft", html: code.value, updated: Date.now() }];
      state.currentId = state.profiles[0].id;
    }
  }

  // ------------------------------------------------------------- gallery -----
  function currentProfile() {
    return state.profiles.filter(function (p) { return p.id === state.currentId; })[0] || null;
  }

  function saveToProfile() {
    var p = currentProfile();
    if (p) {
      p.html = code.value; p.updated = Date.now();
      toast(t("saved"));
    } else {
      saveAs();
    }
    renderGallery(); persist();
  }

  function saveAs() {
    var name = $("gal-name").value.trim();
    if (!name) { $("gal-name").focus(); return; }
    var existing = state.profiles.filter(function (p) { return p.name === name; })[0];
    if (existing) {
      existing.html = code.value; existing.updated = Date.now();
      state.currentId = existing.id;
      toast(t("saved"));
    } else {
      var id = uid();
      state.profiles.unshift({ id: id, name: name, html: code.value, updated: Date.now() });
      state.currentId = id;
      toast(t("saved"));
    }
    $("gal-name").value = "";
    renderGallery(); persist();
  }

  function renderGallery() {
    var box = $("gal-list");
    if (!state.profiles.length) {
      box.innerHTML = '<p class="empty">' + esc(t("galEmpty")) + "</p>";
    } else {
      box.innerHTML = state.profiles.map(function (p) {
        var cur = p.id === state.currentId;
        return '<div class="gal-item' + (cur ? " cur" : "") + '" data-id="' + p.id + '">' +
          '<span class="nm">' + esc(p.name) + (cur ? ' <span class="meta">· ' + esc(t("cur")) + "</span>" : "") + "</span>" +
          '<span class="meta">' + fmtSize(bytes(p.html)) + " · " + new Date(p.updated).toLocaleDateString() + "</span>" +
          '<button class="sm" data-act="open">' + esc(t("open")) + "</button>" +
          '<button class="sm" data-act="dup">' + esc(t("dup")) + "</button>" +
          '<button class="sm ghost danger" data-act="del">' + esc(t("del")) + "</button>" +
          "</div>";
      }).join("");
    }
    $("cnt-gal").textContent = state.profiles.length || "";
  }

  // ------------------------------------------------------------- editor ------
  function insertAtCursor(text) {
    var s = code.selectionStart, e = code.selectionEnd;
    code.setRangeText(text, s, e, "end");
    code.focus();
    schedule();
  }

  // ---------------------------------------------------------------- init -----
  function applyLang() {
    document.documentElement.lang = lang;
    [].forEach.call(document.querySelectorAll("[data-i18n]"), function (el) {
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    $("btn-new").title = t("reset");
    $("uuid").placeholder = "07446625-25bc-4a60-af8f-693385106fd2";
    $("img-url").placeholder = "https://ella.janitorai.com/...";
    $("gal-name").placeholder = t("galNamePh");
    $("token").placeholder = "—";
    [].forEach.call(document.querySelectorAll("#seg-lang button"), function (b) {
      b.classList.toggle("on", b.dataset.lang === lang);
    });
    $("btn-bg").textContent = state.bg === "dark" ? t("bgDark") : t("bgLight");
    $("help-body").innerHTML = t("help");
    $("welcome-body").innerHTML = t("welcomeBody");
    rebuildSnippets();
    renderGallery();
  }

  function rebuildSnippets() {
    var bar = $("snippets");
    bar.innerHTML = "";
    SNIPPETS.forEach(function (s) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = s[lang] || s.ru;
      b.addEventListener("click", function () { insertAtCursor(s.html); });
      bar.appendChild(b);
    });
  }

  function updateTokenState() {
    var el = $("token-state");
    var tok = $("token").value.trim();
    if (!tok) { el.textContent = t("tokenEmpty"); el.style.color = ""; return; }
    var exp = 0;
    try {
      var payload = tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
      payload += "=".repeat((4 - payload.length % 4) % 4);
      exp = (JSON.parse(atob(payload)).exp || 0) * 1000;
    } catch (_) {}
    if (exp && exp < Date.now()) {
      el.textContent = t("tokenExpired"); el.style.color = "var(--err)";
    } else {
      el.textContent = t("tokenSet"); el.style.color = "";
    }
  }

  function initFonts() {
    var sel = $("fontsel");
    FONTS.forEach(function (f) {
      var o = document.createElement("option");
      o.value = f.name; o.textContent = f.name;
      sel.appendChild(o);
    });
  }

  function initEvents() {
    code.addEventListener("input", schedule);
    code.addEventListener("scroll", function () {
      hl.scrollTop = code.scrollTop;
      hl.scrollLeft = code.scrollLeft;
    });
    code.addEventListener("keydown", function (ev) {
      if (ev.key === "Tab") { ev.preventDefault(); insertAtCursor("  "); }
      if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); render(); }
      if (ev.key === "s" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); saveToProfile(); }
    });

    // язык
    $("seg-lang").addEventListener("click", function (ev) {
      var b = ev.target.closest("button");
      if (!b) return;
      lang = b.dataset.lang;
      applyLang(); render(); persist();
    });

    $("btn-apply-font").addEventListener("click", function () {
      var font = $("fontsel").value;
      var s = code.selectionStart, e = code.selectionEnd;
      var sel = code.value.slice(s, e) || (lang === "ru" ? "текст" : "text");
      var ins = '<span style="font-family: ' + font + ';">' + sel + "</span>";
      code.setRangeText(ins, s, e, "end");
      if (s === e) {
        var p = s + ins.length - "</span>".length;
        code.setSelectionRange(p, p);
      }
      code.focus(); schedule();
    });

    // картинка
    $("btn-img").addEventListener("click", function () {
      $("imgpanel").classList.toggle("on");
      if ($("imgpanel").classList.contains("on")) $("img-url").focus();
    });
    $("btn-img-close").addEventListener("click", function () { $("imgpanel").classList.remove("on"); });
    $("btn-img-inline").addEventListener("click", function () {
      var url = $("img-url").value.trim();
      if (!url) { toast(t("imgNoUrl"), true); return; }
      var w = parseInt($("img-w").value, 10) || 320;
      var r = parseInt($("img-r").value, 10) || 0;
      insertAtCursor('<img src="' + url + '" alt="" style="display: block; width: 100%; max-width: ' + w +
        'px; height: auto; border-radius: ' + r + 'px; margin: 0 auto 1rem;">');
    });
    $("btn-img-bg").addEventListener("click", function () {
      var url = $("img-url").value.trim();
      if (!url) { toast(t("imgNoUrl"), true); return; }
      var r = parseInt($("img-r").value, 10) || 0;
      insertAtCursor('<div style="background-image: url(\'' + url + '\'); background-size: cover; background-position: center; ' +
        'height: 220px; border-radius: ' + r + 'px; margin: 0 0 1rem;"></div>');
    });

    // превью
    $("seg-mode").addEventListener("click", function (ev) {
      var b = ev.target.closest("button");
      if (!b) return;
      state.mode = b.dataset.mode;
      [].forEach.call(this.querySelectorAll("button"), function (x) { x.classList.toggle("on", x === b); });
      render();
    });
    $("btn-bg").addEventListener("click", function () {
      state.bg = state.bg === "dark" ? "light" : "dark";
      this.textContent = state.bg === "dark" ? t("bgDark") : t("bgLight");
      render();
    });
    $("btn-refresh").addEventListener("click", render);

    // табы
    document.querySelector(".tabs").addEventListener("click", function (ev) {
      var b = ev.target.closest("button[data-tab]");
      if (!b) return;
      var name = b.dataset.tab;
      [].forEach.call(this.querySelectorAll("button[data-tab]"), function (x) { x.classList.toggle("on", x === b); });
      [].forEach.call(document.querySelectorAll(".pane"), function (p) { p.classList.toggle("on", p.id === "pane-" + name); });
      bottom.classList.remove("collapsed");
      $("btn-collapse").textContent = "⌄";
    });
    $("btn-collapse").addEventListener("click", function () {
      bottom.classList.toggle("collapsed");
      this.textContent = bottom.classList.contains("collapsed") ? "⌃" : "⌄";
    });

    // экспорт
    ["uuid", "token"].forEach(function (id) {
      $(id).addEventListener("input", function () { buildExport(code.value); updateTokenState(); persist(); });
    });
    $("minify").addEventListener("change", function () { buildExport(code.value); persist(); });

    $("btn-copy-script").addEventListener("click", function () { copy($("out").value); });
    $("btn-copy-html").addEventListener("click", function () {
      copy($("minify").checked ? minify(code.value) : code.value);
    });
    $("btn-copy-verify").addEventListener("click", function () { copy(verifySnippet()); });
    $("btn-get-token").addEventListener("click", function () {
      copy(tokenSnippet());
      bottom.classList.remove("collapsed");
      [$("pane-export")].forEach(function () {});
      toast(lang === "ru" ? "Сниппет в буфере — вставь в консоль janitorai.com" : "Snippet copied — paste it in the janitorai.com console");
    });
    $("btn-download").addEventListener("click", function () {
      var blob = new Blob([code.value], { type: "text/html;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "bio.html";
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    });

    // галерея
    $("btn-save").addEventListener("click", saveToProfile);
    $("btn-new").addEventListener("click", function () {
      code.value = STARTER;
      $("gal-name").value = "";
      state.currentId = null;
      render(); renderGallery(); persist();
    });
    $("btn-gal-save").addEventListener("click", saveAs);
    $("gal-name").addEventListener("keydown", function (ev) { if (ev.key === "Enter") saveAs(); });
    $("gal-list").addEventListener("click", function (ev) {
      var btn = ev.target.closest("button[data-act]");
      var row = ev.target.closest(".gal-item");
      if (!btn || !row) return;
      var id = row.dataset.id;
      var p = state.profiles.filter(function (x) { return x.id === id; })[0];
      if (!p) return;
      var act = btn.dataset.act;
      if (act === "open") {
        var cur = currentProfile();
        if (cur && cur.id !== id) cur.html = code.value;
        state.currentId = id;
        code.value = p.html;
      } else if (act === "dup") {
        var copyRow = { id: uid(), name: p.name + " (copy)", html: p.html, updated: Date.now() };
        state.profiles.unshift(copyRow);
        state.currentId = copyRow.id;
        code.value = copyRow.html;
      } else if (act === "del") {
        if (!confirm(t("confirmDel", { n: p.name }))) return;
        state.profiles = state.profiles.filter(function (x) { return x.id !== id; });
        if (state.currentId === id) {
          state.currentId = state.profiles.length ? state.profiles[0].id : null;
          code.value = state.currentId ? state.profiles[0].html : STARTER;
        }
        toast(t("deleted"));
      }
      render(); renderGallery(); persist();
    });

    $("btn-gal-export").addEventListener("click", function () {
      var cur = currentProfile();
      if (cur) cur.html = code.value;
      var blob = new Blob([JSON.stringify({ app: "jai-bio-studio", version: 2, profiles: state.profiles }, null, 2)],
        { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "jai-bio-profiles.json";
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    });
    $("btn-gal-import").addEventListener("click", function () { $("gal-file").click(); });
    $("gal-file").addEventListener("change", function (ev) {
      var f = ev.target.files && ev.target.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var data = JSON.parse(fr.result);
          var list = Array.isArray(data) ? data : data.profiles;
          if (!Array.isArray(list)) throw new Error("no profiles");
          var added = 0;
          list.forEach(function (p) {
            if (!p || typeof p.html !== "string") return;
            state.profiles.unshift({ id: uid(), name: p.name || "imported", html: p.html, updated: Date.now() });
            added++;
          });
          renderGallery(); persist();
          toast(added + " " + t("saved"));
        } catch (e) { toast("JSON: " + e.message, true); }
      };
      fr.readAsText(f);
      ev.target.value = "";
    });
    $("btn-gal-clear").addEventListener("click", function () {
      if (!confirm(t("confirmClear"))) return;
      state.profiles = [];
      state.currentId = null;
      code.value = STARTER;
      render(); renderGallery(); persist();
    });

    // модалка помощи
    function openWelcome() { $("welcome").classList.add("on"); }
    function closeWelcome() {
      if ($("welcome-hide").checked) {
        state.hideWelcome = true;
        persist();
      }
      $("welcome").classList.remove("on");
    }
    $("welcome-close").addEventListener("click", closeWelcome);
    $("welcome-ok").addEventListener("click", closeWelcome);
    $("welcome").addEventListener("click", function (ev) {
      if (ev.target === $("welcome")) closeWelcome();
    });
    window.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape" && $("welcome").classList.contains("on")) closeWelcome();
      if (ev.key === "F1") { ev.preventDefault(); openWelcome(); }
    });
    $("btn-help").addEventListener("click", openWelcome);

    // ресайз
    var dragging = false;
    $("divider").addEventListener("mousedown", function (ev) {
      dragging = true; document.body.style.cursor = "col-resize"; ev.preventDefault();
    });
    window.addEventListener("mousemove", function (ev) {
      if (!dragging) return;
      var r = split.getBoundingClientRect();
      var w = (ev.clientX - r.left) / r.width * 100;
      w = Math.min(82, Math.max(18, w));
      left.style.flexBasis = w + "%";
      right.style.flexBasis = (100 - w) + "%";
    });
    window.addEventListener("mouseup", function () {
      dragging = false; document.body.style.cursor = "";
    });

    window.addEventListener("beforeunload", function () {
      var cur = currentProfile();
      if (cur) cur.html = code.value;
      persist();
    });
  }

  // ----------------------------------------------------------------- run -----
  initFonts();
  restore();
  initEvents();
  applyLang();
  render();
  if (!state.hideWelcome) $("welcome").classList.add("on");
})();
</script>
</body>
</html>
